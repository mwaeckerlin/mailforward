# Builds the images of this repository for amd64 and arm64 and publishes them
# on Docker Hub, on every push to the default branch, and in the hourly check
# when a parent image or a download changed or the image is a week old. The
# build itself is the reusable workflow docker-image.yml of
# mwaeckerlin/scratch; its README explains the setup.

name: docker

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# one run per branch at a time; a branch never cancels the run of another
concurrency: docker-${{ github.ref_name }}

jobs:
  docker:
    uses: mwaeckerlin/scratch/.github/workflows/docker-image.yml@master
    # the hourly check starts the version lines 1, 2 and 3 (tags `1`, `2`, `3`) as well
    permissions:
      actions: write
      contents: read
    with:
      branch-tags: '[{"branch": "1", "suffix": "-1"}, {"branch": "2", "suffix": "-2"}, {"branch": "3", "suffix": "-3"}]'
    secrets: inherit
